services:

  postgres:
    image: postgres:16
    container_name: masteryloop-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: masteryloop
      POSTGRES_USER: mastery
      POSTGRES_PASSWORD: mastery_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mastery -d masteryloop"]
      interval: 5s
      timeout: 5s
      retries: 10


  redis:
    image: redis:7
    container_name: masteryloop-redis
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


volumes:
  postgres_data:
  redis_data: